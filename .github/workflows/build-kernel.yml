name: Build Debian Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version to build (e.g. 6.12.8)"
        required: true
        default: "6.12.8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev dwarves bc rsync kmod cpio fakeroot \
            git wget ccache

      - name: Set up ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --max-size=5G

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: kernel-ccache-${{ runner.os }}

      - name: Download kernel source
        run: |
          KVER="${{ github.event.inputs.kernel_version }}"
          MAJOR=$(echo "$KVER" | cut -d. -f1)
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${KVER}.tar.xz"
          tar xf "linux-${KVER}.tar.xz"

      - name: Configure kernel
        run: |
          cd linux-*/
          make defconfig
          # Optional: shrink config to only what this runner's hardware needs
          # yes "" | make localmodconfig

      - name: Build .deb packages
        run: |
          cd linux-*/
          make -j"$(nproc)" bindeb-pkg

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-kernel-debs
          path: "*.deb"
          retention-days: 14
