# Revision 13: Project C (PDS / BMQ) gets the same two 7.2.7 fixes as MuQSS: SCHED_CLASS_EXT hunk rebuilt (0009-prjc.patch
#   rejected it) and the rt_mutex_futex_* link shim (alt_core.c lacks them too). Both steps now handle all three schedulers.
# Revision 12: adds optiplex3090 profile (Dell OptiPlex 3090, i5-10500T Comet Lake, 6 cores / 12 threads, v7.2.7); nr_cpus gains 12.
# Revision 11: adds i3-6100 profile (Skylake-S desktop, 2 cores / 4 threads, v7.2.7; same targets as nuc7).
# Revision 10: MuQSS SCHED_CLASS_EXT hunk rebuilt from the patch itself (anchored only on the config + prompt lines) after 7.2.7 rejected it; pre-build verifies the gate landed; NUC profile moves to v7.2.7.
# Revision 9: context-tolerant MuQSS SCHED_CLASS_EXT hunk; pre-build fails on rejected hunks or sched_ext + MuQSS.
# Revision 8: MuQSS v0.31 compatibility shim for 7.2.5+ (missing rt_mutex_futex_* helpers).
# Revision 7: MuQSS + profile kernel moves 6.18 profiles to 7.2-latest; Node 24 action versions.
# Revision 6: really disables debug info (no -dbg package) unless sched_ext=require.
# Revision 5: MuQSS defaults to Con Kolivas' 100 Hz tick; 100 Hz selectable.
# Revision 4: adds MuQSS (-ck, 7.1+ only) and optional sched_ext support.
# Revision 3: adds Project C (PDS / BMQ) scheduler options.
# Revision 2: read tkg-reference.html for required target configurations.
# Reviewed upstream pin; full compilation and hardware testing still required.
#
# Device profiles (kernel, -march, timer Hz, max logical CPUs):
#   nuc7          v7.2.7    skylake    500  4   Intel NUC7, active intel_pstate
#   i3-6100       v7.2.7    skylake    500  4   Core i3-6100 desktop (2C/4T, one L3), active intel_pstate
#   optiplex3090  v7.2.7    skylake    500  12  Dell OptiPlex 3090 (i5-10500T Comet Lake, 6C/12T, one L3), active intel_pstate
#   z220          v6.18.51  ivybridge  500  8   HP Z220
#   e6410         v6.18.51  westmere   300  4   Dell Latitude E6410 (adds swap / zswap)
# Recommended defaults for every profile: bore, full preemption, gcc, O2, sched_ext auto, module_trimming none.
# MuQSS on the 4-thread Skylake profiles: runqueue smt (default); mc is the only other distinct layout there.
# MuQSS on optiplex3090: smt (default) = 6 queues, one per core; none = 12 queues; mc and wider = one queue
# for all 12 threads (single die, single L3, so mc / mc-llc / smp / all behave the same).
name: Build linux-tkg (Devuan device profiles)
'on':
  workflow_dispatch:
    inputs:
      machine:
        description: Device profile; requires configs/<machine>.config in this repository
        required: true
        type: choice
        default: nuc7
        options:
        - nuc7
        - i3-6100
        - optiplex3090
        - z220
        - e6410
      kernel_version:
        description: 'profile, exact tag (v6.18.51), or series (6.18-latest). Supported: 6.18 / 7.2. MuQSS + profile uses 7.2-latest on 6.18 profiles'
        required: true
        default: profile
      cpu_scheduler:
        description: 'BORE baseline; EEVDF comparison; PDS / BMQ = Project C; MuQSS = Con Kolivas -ck (7.2 only here). PDS/BMQ/MuQSS disable PSI and sched_ext. RT requires EEVDF.'
        required: true
        type: choice
        default: bore
        options:
        - bore
        - eevdf
        - pds
        - bmq
        - muqss
      muqss_runqueue:
        description: 'MuQSS only: runqueue sharing. smt = linux-tkg default (recommended on nuc7 / i3-6100 / optiplex3090); mc / mc-llc share per core complex; none = one queue per CPU'
        required: true
        type: choice
        default: smt
        options:
        - smt
        - none
        - mc
        - mc-llc
        - smp
        - all
      sched_ext:
        description: 'BORE / EEVDF only. auto = whatever the config ends up with; require = build BTF and guarantee sched_ext for scx_* schedulers (bigger, slower build)'
        required: true
        type: choice
        default: auto
        options:
        - auto
        - require
      preemption:
        description: Full desktop preemption, or experimental real-time
        required: true
        type: choice
        default: full
        options:
        - full
        - rt
      compiler:
        description: GCC baseline; LLVM comparison without LTO
        required: true
        type: choice
        default: gcc
        options:
        - gcc
        - llvm
      opt_level:
        description: 1 = O2; 2 = O3; 3 = Os
        required: true
        type: choice
        default: '1'
        options:
        - '1'
        - '2'
        - '3'
      timer_freq:
        description: 'profile: NUC 500, i3-6100 500, OptiPlex 3090 500, Z220 500, E6410 300 Hz; MuQSS always 100 Hz (-ck default)'
        required: true
        type: choice
        default: profile
        options:
        - profile
        - '100'
        - '250'
        - '300'
        - '500'
        - '1000'
      cpu_governor:
        description: Default generic governor; NUC, i3-6100 and OptiPlex 3090 active intel_pstate use their own algorithms
        required: true
        type: choice
        default: schedutil
        options:
        - schedutil
        - ondemand
        - performance
      cpu_arch:
        description: profile, or explicit compatible target; never targets the runner
        required: true
        type: choice
        default: profile
        options:
        - profile
        - x86-64
        - westmere
        - sandybridge
        - ivybridge
        - skylake
      nr_cpus:
        description: 'Maximum logical CPUs; profile: NUC 4 / i3-6100 4 / OptiPlex 3090 12 / Z220 8 / E6410 4. Check actual hardware.'
        required: true
        type: choice
        default: profile
        options:
        - profile
        - '4'
        - '8'
        - '12'
      module_trimming:
        description: Optional per-device modules/<machine>.db; keep none for initial builds
        required: true
        type: choice
        default: none
        options:
        - none
        - modprobed-db
      build_label:
        description: Optional lowercase label, max 8 characters, e.g. test1. Run ID is appended.
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.machine }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash -euo pipefail {0}
env:
  TKG_REF: 7e98360cfadd8d7f6da829da07ce11bd4646e006
  TKG_REPO: https://github.com/Frogging-Family/linux-tkg.git
  CCACHE_DIR: ${{ github.workspace }}/.ccache
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
    - name: Checkout private repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Resolve profile and validate inputs
      env:
        MACHINE: ${{ inputs.machine }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
        CPU_SCHEDULER: ${{ inputs.cpu_scheduler }}
        MUQSS_RUNQUEUE: ${{ inputs.muqss_runqueue }}
        SCHED_EXT: ${{ inputs.sched_ext }}
        PREEMPTION: ${{ inputs.preemption }}
        COMPILER: ${{ inputs.compiler }}
        OPT_LEVEL: ${{ inputs.opt_level }}
        TIMER_FREQ: ${{ inputs.timer_freq }}
        CPU_GOVERNOR: ${{ inputs.cpu_governor }}
        CPU_ARCH: ${{ inputs.cpu_arch }}
        NR_CPUS: ${{ inputs.nr_cpus }}
        MODULE_TRIMMING: ${{ inputs.module_trimming }}
        BUILD_LABEL: ${{ inputs.build_label }}
      run: |
        python3 - <<'PYCODE'
        import os,re,json,pathlib
        p=pathlib.Path(os.environ['GITHUB_WORKSPACE']); e=os.environ
        # machine: (kernel, -march, timer Hz, max logical CPUs). Keep names short: they end up in the kernel release.
        # Comet Lake (i5-10500T) is a Skylake-derived core; GCC has no separate cometlake target.
        profiles={
            'nuc7':        ('v7.2.7',  'skylake',  '500','4'),
            'i3-6100':     ('v7.2.7',  'skylake',  '500','4'),
            'optiplex3090':('v7.2.7',  'skylake',  '500','12'),
            'z220':        ('v6.18.51','ivybridge','500','8'),
            'e6410':       ('v6.18.51','westmere', '300','4'),
        }
        # Kernel series this workflow accepts. Adding one here is only half the job:
        # the pinned linux-tkg must also carry patches for it (checked after cloning).
        series_ok=['6.18','7.2']
        m=e['MACHINE']; assert m in profiles, 'Unknown machine'
        v,a,h,n=profiles[m]
        for name,allowed in {'CPU_SCHEDULER':['bore','eevdf','pds','bmq','muqss'],'MUQSS_RUNQUEUE':['smt','none','mc','mc-llc','smp','all'],'SCHED_EXT':['auto','require'],'PREEMPTION':['full','rt'],'COMPILER':['gcc','llvm'],'OPT_LEVEL':['1','2','3'],'CPU_GOVERNOR':['schedutil','ondemand','performance'],'MODULE_TRIMMING':['none','modprobed-db']}.items():
            assert e[name] in allowed, 'Invalid '+name
        # MuQSS only exists for 7.1+. With kernel_version=profile, move 6.18 profiles to the newest
        # supported series instead of failing. An explicitly typed version is left alone.
        if e['KERNEL_VERSION']=='profile' and e['CPU_SCHEDULER']=='muqss' and not v.startswith('v7.'):
            print(f'::notice::MuQSS needs Linux 7.1 or newer; {m} profile kernel {v} replaced with 7.2-latest')
            v='7.2-latest'
        v=v if e['KERNEL_VERSION']=='profile' else e['KERNEL_VERSION']
        sre='|'.join(re.escape(s) for s in series_ok)
        assert re.fullmatch(r'(?:v?(?:'+sre+r')\.[0-9]+|(?:'+sre+r')-latest)',v), 'Use a supported stable tag or series: '+', '.join(series_ok)
        if not v.endswith('-latest') and not v.startswith('v'): v='v'+v
        series=re.match(r'v?([0-9]+\.[0-9]+)',v).group(1)
        a=a if e['CPU_ARCH']=='profile' else e['CPU_ARCH']; assert a in ['x86-64','westmere','sandybridge','ivybridge','skylake']
        # MuQSS is built around a low tick: -ck converts short sleeps and timeouts to hrtimers,
        # so 'profile' follows Con Kolivas' 100 Hz default. An explicit value still wins.
        if e['TIMER_FREQ']=='profile': h='100' if e['CPU_SCHEDULER']=='muqss' else h
        else: h=e['TIMER_FREQ']
        assert h in ['100','250','300','500','1000']
        n=n if e['NR_CPUS']=='profile' else e['NR_CPUS']; assert n in ['4','8','12']
        assert e['PREEMPTION']!='rt' or e['CPU_SCHEDULER']=='eevdf', 'RT requires EEVDF (linux-tkg offers no alternative schedulers with PREEMPT_RT)'
        assert e['SCHED_EXT']!='require' or e['CPU_SCHEDULER'] in ('bore','eevdf'), 'sched_ext only works with BORE or EEVDF; PDS, BMQ and MuQSS replace the scheduler core it plugs into'
        rq=e['MUQSS_RUNQUEUE'] if e['CPU_SCHEDULER']=='muqss' else 'n/a'
        label=e['BUILD_LABEL']; assert re.fullmatch(r'[a-z0-9][a-z0-9.-]{0,7}',label) or not label, 'Invalid build_label'
        c=p/'configs'/f'{m}.config'; assert c.is_file(), f'Missing {c}: export the target Devuan /boot/config-<version>; see guide'
        s=c.read_text(); assert 'CONFIG_X86_64=y' in s and 'CONFIG_MODULES=y' in s, 'Expected an x86-64 modular kernel baseline'
        if e['MODULE_TRIMMING']=='modprobed-db':
            db=p/'modules'/f'{m}.db'; assert db.is_file() and db.stat().st_size, f'Missing or empty {db}'
        suffix=f"{m}-{e['CPU_SCHEDULER']}-{e['PREEMPTION']}"+(('-'+label) if label else '')+f"-r{e['GITHUB_RUN_ID']}a{e['GITHUB_RUN_ATTEMPT']}"
        resolved={'MACHINE':m,'VERSION':v,'SERIES':series,'ARCH':a,'HZ':h,'NR':n,'SCHEDULER':e['CPU_SCHEDULER'],'RUNQUEUE':rq,'SCHED_EXT':e['SCHED_EXT'],'PREEMPTION':e['PREEMPTION'],'COMPILER':e['COMPILER'],'OPT':e['OPT_LEVEL'],'GOVERNOR':e['CPU_GOVERNOR'],'TRIMMING':e['MODULE_TRIMMING'],'SUFFIX':suffix}
        (p/'dist/metadata').mkdir(parents=True,exist_ok=True)
        (p/'dist/metadata/profile.json').write_text(json.dumps(resolved,indent=2)+'\n')
        with open(e['GITHUB_ENV'],'a') as f:
            for k,val in resolved.items(): f.write('BUILD_'+k+'='+val+'\n')
        print(json.dumps(resolved,indent=2))
        PYCODE
    - name: Free up disk space
      run: |
        # A full-module kernel build plus the kernel git clone can approach
        # 30 GB; the stock runner only has ~25 GB free.
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/share/swift \
          /usr/local/lib/android \
          /usr/local/.ghcup \
          /opt/ghc \
          /opt/hostedtoolcache \
          2>/dev/null || true
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        if [ "$BUILD_SCHED_EXT" = require ]; then
          # BTF needs full DWARF debug info during the build, which costs many extra GB.
          sudo rm -rf \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /usr/share/miniconda \
            /usr/local/share/boost \
            2>/dev/null || true
        fi
        df -h /
    - name: Clone reviewed upstream commit
      run: |
        [[ "$TKG_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'TKG_REF must be a full commit SHA'; exit 1; }
        git init -q linux-tkg
        git -C linux-tkg remote add origin "$TKG_REPO"
        git -C linux-tkg fetch -q --depth 1 origin "$TKG_REF"
        git -C linux-tkg checkout -q FETCH_HEAD
        [[ "$(git -C linux-tkg rev-parse HEAD)" = "$TKG_REF" ]]
        git -C linux-tkg log -1 --format=fuller > dist/metadata/tkg-commit.txt
    - name: Check scheduler availability at the pinned commit
      run: |
        # linux-tkg only offers a scheduler for a series when its patch file exists.
        # Failing here costs seconds instead of a long build that falls over in prepare.
        case "$BUILD_SCHEDULER" in
          pds|bmq) patch=0009-prjc.patch ;;
          muqss)   patch=0004-muqss.patch ;;
          bore)    patch=0001-bore.patch ;;
          *)       patch='' ;;
        esac
        {
          echo "scheduler: $BUILD_SCHEDULER"
          echo "series: $BUILD_SERIES"
          echo "muqss runqueue: $BUILD_RUNQUEUE"
          echo "sched_ext: $BUILD_SCHED_EXT"
        } > dist/metadata/scheduler.txt
        if [ -n "$patch" ]; then
          f="linux-tkg/linux-tkg-patches/$BUILD_SERIES/$patch"
          if [ ! -s "$f" ]; then
            avail=$(ls linux-tkg/linux-tkg-patches/*/"$patch" 2>/dev/null | awk -F/ '{print $(NF-1)}' | sort -V | tr '\n' ' ')
            echo "::error::'$BUILD_SCHEDULER' is not available for $BUILD_SERIES at TKG_REF (no $patch). Series with it: ${avail:-none}"
            exit 1
          fi
          echo "patch: $patch" >> dist/metadata/scheduler.txt
          # Record which scheduler release (and any tkg rebase note) is being used.
          if [ "$patch" = 0009-prjc.patch ]; then
            grep -m1 -o 'ALT_SCHED_VERSION "[^"]*"' "$f" >> dist/metadata/scheduler.txt || true
          fi
          grep -m1 '^Subject:' "$f" >> dist/metadata/scheduler.txt || true
        fi
        { echo '### Scheduler'; sed 's/^/    /' dist/metadata/scheduler.txt; } >> "$GITHUB_STEP_SUMMARY"
        cat dist/metadata/scheduler.txt
    - name: Fix scheduler SCHED_CLASS_EXT Kconfig hunk
      if: contains(fromJSON('["muqss","pds","bmq"]'), env.BUILD_SCHEDULER)
      run: |
        python3 - <<'PYCODE'
        # MuQSS v0.31 and Project C (PDS / BMQ) both gate SCHED_CLASS_EXT in kernel/Kconfig.preempt with a hunk
        # that rewrites the entry's "depends on" line and carries several lines of context around it. Stable
        # updates keep changing the depends/select lines of that entry (7.2.x added "select GENERIC_ALLOCATOR";
        # 7.2.7 rejected MuQSS's Revision 9 replacement with "Hunk #3 FAILED at 170" and 0009-prjc.patch with
        # "Hunk #2 FAILED at 168"), so linux-tkg stops in prepare.
        # The hunk is now located structurally (whatever its context) and rebuilt as a one-line insertion
        # anchored only on the entry's "config" line and its prompt, which are unchanged since sched_ext landed:
        #      config SCHED_CLASS_EXT
        #     +	depends on !SCHED_MUQSS            (!SCHED_ALT for PDS / BMQ)
        #      	bool "Extensible Scheduling Class"
        # Kconfig ANDs all "depends on" lines of an entry and attribute order does not matter.
        # verify-config.py later confirms the gate really sits in the SCHED_CLASS_EXT entry.
        import os,re,pathlib
        e=os.environ; p=pathlib.Path(e['GITHUB_WORKSPACE'])
        # scheduler: (patch file, Kconfig symbol the patch adds and gates sched_ext on)
        pf,gate={'muqss':('0004-muqss.patch','SCHED_MUQSS'),'pds':('0009-prjc.patch','SCHED_ALT'),'bmq':('0009-prjc.patch','SCHED_ALT')}[e['BUILD_SCHEDULER']]
        f=p/'linux-tkg/linux-tkg-patches'/e['BUILD_SERIES']/pf
        out=p/'dist/metadata/sched-kconfig-fix.txt'
        def note(msg,level='notice'):
            print(f'::{level}::sched-kconfig-fix: {msg}'); out.write_text(msg+'\n')
        def fail(msg):
            note(msg,'error'); raise SystemExit(1)
        src=f.read_text(); lines=src.splitlines(keepends=True)
        hdr=re.compile(r'@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@')
        prompt='bool "Extensible Scheduling Class"'
        res=[]; cur=None; done=0; i=0
        while i<len(lines):
            l=lines[i]
            if l.startswith('+++ '):
                cur=l[4:].split('\t')[0].strip(); res.append(l); i+=1; continue
            m=hdr.match(l)
            if not m:
                res.append(l); i+=1; continue
            a,ac,b,bc=int(m[1]),int(m[2] or 1),int(m[3]),int(m[4] or 1)
            j=i+1; o=n=0
            while o<ac or n<bc:
                if j>=len(lines): fail(f'truncated hunk at {f.name}:{i+1}')
                t=lines[j][:1]
                if t in (' ','\n'): o+=1; n+=1
                elif t=='-': o+=1
                elif t=='+': n+=1
                elif t!='\\': fail(f'malformed hunk at {f.name}:{i+1}')
                j+=1
            while j<len(lines) and lines[j].startswith('\\'): j+=1
            body=lines[i+1:j]; text=''.join(body)
            if cur=='b/kernel/Kconfig.preempt' and '!'+gate in text and 'Extensible Scheduling Class' in text:
                ol=a
                for bl in body:
                    if bl.startswith(' ') and prompt in bl: break
                    if bl[:1] in (' ','\n','-'): ol+=1
                else:
                    fail(f'SCHED_CLASS_EXT prompt is not a context line in its hunk ({f.name}:{i+1}); review {pf}')
                res.append(f'@@ -{ol-1},2 +{ol-1+b-a},3 @@\n config SCHED_CLASS_EXT\n+\tdepends on !{gate}\n'+bl)
                done+=1
            else:
                res+=[l]+body
            i=j
        new=''.join(res)
        if done>1: fail(f'{done} SCHED_CLASS_EXT hunks found in {f.name}; expected one')
        if done==0:
            # Not fatal here: a newer MuQSS / Project C may carry its own fix. verify-config.py still fails the
            # build on any .rej file, on sched_ext with an alternative scheduler, or on a missing gate.
            note(f'SCHED_CLASS_EXT hunk not found; review {pf} before updating TKG_REF','warning')
        elif new==src:
            note('patch already carries the minimal SCHED_CLASS_EXT hunk; nothing to do')
        else:
            f.write_text(new)
            note('replaced SCHED_CLASS_EXT hunk with a config+prompt anchored insertion')
        PYCODE
    - name: Write safely quoted TKG settings and fragments
      run: |
        python3 - <<'PYCODE'
        import pathlib,os,shlex,json,shutil
        p=pathlib.Path(os.environ['GITHUB_WORKSPACE']); e=os.environ; t=p/'linux-tkg'
        # Schedulers that replace the core scheduler; linux-tkg turns PSI off for all of them.
        alt=e['BUILD_SCHEDULER'] in ('pds','bmq','muqss')
        scx=e['BUILD_SCHED_EXT']=='require'
        cfg={'_distro': 'Debian', '_preempt_rt_force': '0', '_sched_yield_type': '1', '_rr_interval': 'default', '_bore_min_base_slice_ns': '2000000', '_smt_nice': 'true', '_tickless': '2', '_install_after_building': 'no', '_logging_use_script': 'no', '_menunconfig': 'false', '_diffconfig': 'false', '_user_patches': 'false', '_user_patches_no_confirm': 'false', '_config_fragments': 'true', '_config_fragments_no_confirm': 'true', '_community_patches': '', '_configfile': 'ci-base.config', '_config_updating': 'olddefconfig', '_offline': '', '_force_all_threads': 'true', '_noccache': 'false', '_glitched_base': 'true', '_zenify': 'true', '_misc_adds': 'true', '_clear_patches': 'true', '_openrgb': 'false', '_mglru': 'true', '_ntsync': 'false', '_aggressive_ondemand': 'true', '_random_trust_cpu': 'true', '_acs_override': 'false', '_ftracedisable': 'false', '_numadisable': 'false', '_debugdisable': 'false', '_STRIP': 'true', '_NR_CPUS_value': '', '_tcp_cong_alg': '', '_custom_commandline': '', '_lto_mode': 'no', '_llvm_ias': '1', '_libunwind_replace': 'false', 'KCFLAGS': '', 'KCPPFLAGS': '', 'KRUSTFLAGS': '', '_nofallback': 'true', '_kernel_on_diet': 'false'}
        cfg.update(_version=e['BUILD_VERSION'],_cpusched=e['BUILD_SCHEDULER'],_compiler=e['BUILD_COMPILER'],_compileroptlevel=e['BUILD_OPT'],_processor_opt=e['BUILD_ARCH'],_timer_freq=e['BUILD_HZ'],_default_cpu_gov=e['BUILD_GOVERNOR'],_kernel_localversion=e['BUILD_SUFFIX'],_NR_CPUS_value=e['BUILD_NR'],_preempt_rt='1' if e['BUILD_PREEMPTION']=='rt' else '0',_modprobeddb='true' if e['BUILD_TRIMMING']=='modprobed-db' else 'false',_modprobeddb_db_path=str(p/'modules'/ (e['BUILD_MACHINE']+'.db')))
        if e['BUILD_SCHEDULER']=='muqss': cfg['_runqueue_sharing']=e['BUILD_RUNQUEUE']; cfg['_irq_threading']='false'
        # _STRIP=true makes linux-tkg force DEBUG_INFO_NONE, which silently removes BTF and therefore sched_ext.
        if scx: cfg['_STRIP']='false'
        shutil.copyfile(p/'configs'/(e['BUILD_MACHINE']+'.config'),t/'ci-base.config')
        # Device fragments contain Kconfig assignments, not executable shell overrides.
        f=p/'configs'/(e['BUILD_MACHINE']+'.myfrag')
        if f.is_file(): shutil.copyfile(f,t/'10-device.myfrag')
        common=['CONFIG_LOCALVERSION=""','# CONFIG_LOCALVERSION_AUTO is not set','CONFIG_SYSTEM_TRUSTED_KEYS=""','CONFIG_SYSTEM_REVOCATION_KEYS=""','CONFIG_MODULE_SIG_KEY="certs/signing_key.pem"','# CONFIG_MODULE_SIG_FORCE is not set','CONFIG_CMDLINE=""','# CONFIG_CMDLINE_BOOL is not set','# CONFIG_CMDLINE_OVERRIDE is not set','CONFIG_BLK_DEV_INITRD=y','CONFIG_DEVTMPFS=y','CONFIG_DEVTMPFS_MOUNT=y','CONFIG_EFI_PARTITION=y','CONFIG_SMP=y','CONFIG_MODULES=y','CONFIG_NO_HZ_IDLE=y','# CONFIG_NO_HZ_FULL is not set','# CONFIG_PREEMPT_NONE is not set','# CONFIG_PREEMPT_VOLUNTARY is not set']
        # Fragments are merged after linux-tkg's own config pass, so they would override
        # its workaround. linux-tkg disables PSI for PDS/BMQ/MuQSS; keep it that way.
        if alt: common+=['# CONFIG_PSI is not set']
        else: common+=['CONFIG_PSI=y','CONFIG_PSI_DEFAULT_DISABLED=n']
        common+=['CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE='+('y' if e['BUILD_OPT']=='1' else 'n'),'CONFIG_CC_OPTIMIZE_FOR_SIZE='+('y' if e['BUILD_OPT']=='3' else 'n')]
        if e['BUILD_PREEMPTION']=='rt': common+=['CONFIG_EXPERT=y','CONFIG_PREEMPT_RT=y','# CONFIG_PREEMPT is not set','# CONFIG_PREEMPT_DYNAMIC is not set']
        else: common+=['CONFIG_PREEMPT=y','CONFIG_PREEMPT_DYNAMIC=y','# CONFIG_PREEMPT_RT is not set']
        # Debug info is a Kconfig choice. linux-tkg's _STRIP only flips DEBUG_INFO_NONE on and leaves the
        # Devuan config's DWARF choice set too, so the DWARF entry wins and debug info (plus a -dbg package)
        # stays on. Every member is set explicitly here; fragments are merged last, so this decides it.
        if scx: common+=['CONFIG_BPF=y','CONFIG_BPF_SYSCALL=y','CONFIG_BPF_JIT=y','# CONFIG_DEBUG_INFO_NONE is not set','CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y','# CONFIG_DEBUG_INFO_DWARF4 is not set','# CONFIG_DEBUG_INFO_DWARF5 is not set','# CONFIG_DEBUG_INFO_REDUCED is not set','# CONFIG_DEBUG_INFO_SPLIT is not set','CONFIG_DEBUG_INFO_BTF=y','CONFIG_DEBUG_INFO_BTF_MODULES=y','CONFIG_SCHED_CLASS_EXT=y']
        else: common+=['CONFIG_DEBUG_INFO_NONE=y','# CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT is not set','# CONFIG_DEBUG_INFO_DWARF4 is not set','# CONFIG_DEBUG_INFO_DWARF5 is not set']
        # Per-device extras. The i3-6100 (31 GB RAM, 50 GB swap), the OptiPlex 3090 (31 GB RAM, 36 GB swap)
        # and the NUC / Z220 need none.
        if e['BUILD_MACHINE']=='e6410': common+=['CONFIG_SWAP=y','CONFIG_ZSWAP=y','CONFIG_ZSMALLOC=y','CONFIG_CRYPTO_ZSTD=y','CONFIG_CRYPTO_LZ4=y']
        (t/'99-ci.myfrag').write_text('\n'.join(common)+'\n')
        f=pathlib.Path.home()/'.config/frogminer/linux-tkg.cfg'; f.parent.mkdir(parents=True,exist_ok=True)
        f.write_text('# Generated; values are shell-quoted.\n'+''.join(k+'='+shlex.quote(v)+'\n' for k,v in cfg.items()))
        shutil.copyfile(f,p/'dist/metadata/overrides.cfg')
        shutil.copyfile(t/'ci-base.config',p/'dist/metadata/base.config')
        for f in t.glob('*.myfrag'): shutil.copyfile(f,p/'dist/metadata'/f.name)
        PYCODE
    - name: Restore compiler cache
      uses: actions/cache@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: tkg-${{ runner.os }}-${{ inputs.machine }}-${{ env.TKG_REF }}-${{ env.BUILD_COMPILER }}-${{ env.BUILD_ARCH
          }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          tkg-${{ runner.os }}-${{ inputs.machine }}-${{ env.TKG_REF }}-${{ env.BUILD_COMPILER }}-${{ env.BUILD_ARCH }}-
    - name: Install and configure compiler cache
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache gcc g++ binutils
        if [ "$BUILD_COMPILER" = llvm ]; then sudo apt-get install -y clang lld llvm; fi
        # pahole generates BTF; without it the kernel config quietly drops DEBUG_INFO_BTF.
        if [ "$BUILD_SCHED_EXT" = require ]; then sudo apt-get install -y dwarves; fi
        sudo /usr/sbin/update-ccache-symlinks
        printf '%s\n' /usr/lib/ccache >> "$GITHUB_PATH"
        ccache --max-size=2G
        ccache --zero-stats
        { gcc --version; ld --version; ccache --version; if [ "$BUILD_COMPILER" = llvm ]; then clang --version; ld.lld --version; fi; if command -v pahole >/dev/null; then echo "pahole $(pahole --version)"; fi; } > dist/metadata/toolchain.txt
        printf '%s\n' "${ImageOS:-unknown} ${ImageVersion:-unknown}" > dist/metadata/runner.txt
    - name: Install checked pre-build validation hook
      run: |
        cat > "$GITHUB_WORKSPACE/sched-compat.py" <<'PYCODE'
        # Compatibility shim for alternative schedulers written against 7.2.0 on 7.2.5+ stable kernels:
        # MuQSS v0.31 (kernel/sched/MuQSS.c) and Project C PDS / BMQ (kernel/sched/alt_core.c).
        # 7.2.5 made rt_mutex_wait_proxy_lock() call rt_mutex_futex_{pre,post}_schedule(), which mainline
        # defines in kernel/sched/core.c. Both schedulers build their own file instead of core.c and lack them,
        # so vmlinux fails to link. Adds them only when the tree calls them and the scheduler does not define them.
        import pathlib,re,sys
        src=pathlib.Path('.'); api=src/'kernel/locking/rtmutex_api.c'
        out=pathlib.Path(sys.argv[1]) if len(sys.argv)>1 else None
        def note(msg):
            print('sched-compat:',msg)
            if out: out.write_text(msg+'\n')
        mq=next((f for f in (src/'kernel/sched/MuQSS.c',src/'kernel/sched/alt_core.c') if f.is_file()),None)
        if not mq: note('not a MuQSS / Project C tree; nothing to do'); sys.exit(0)
        s=mq.read_text()
        if 'rt_mutex_futex_post_schedule' not in api.read_text(): note('kernel does not use futex rt_mutex helpers; nothing to do'); sys.exit(0)
        if re.search(r'^void rt_mutex_futex_post_schedule\(void\)',s,re.M): note(f'{mq.name} already defines futex helpers; nothing to do'); sys.exit(0)
        m=re.search(r'^void rt_mutex_post_schedule\(void\)\n\{\n.*?^\}\n',s,re.M|re.S)
        assert m and len(re.findall(r'^void rt_mutex_post_schedule\(void\)',s,re.M))==1, f'{mq.name} layout changed; review shim'
        shim='''
        /*
         * Futex-context variants (added to mainline in 7.2.5 stable). As in mainline they skip
         * sched_submit_work()/sched_update_worker(): no such work can be pending in futex syscall context.
         */
        void rt_mutex_futex_pre_schedule(void)
        {
        #ifdef CONFIG_RT_MUTEXES
        \tlockdep_assert(!(current->flags & (PF_WQ_WORKER | PF_IO_WORKER)));
        \tlockdep_assert(!current->plug);
        \tlockdep_assert(!fetch_and_set(current->sched_rt_mutex, 1));
        #endif
        }

        void rt_mutex_futex_post_schedule(void)
        {
        #ifdef CONFIG_RT_MUTEXES
        \tlockdep_assert(fetch_and_set(current->sched_rt_mutex, 0));
        #endif
        }
        '''
        mq.write_text(s[:m.end()]+shim+s[m.end():])
        note(f'added rt_mutex_futex_pre_schedule/rt_mutex_futex_post_schedule to kernel/sched/{mq.name}')
        PYCODE
        cat > "$GITHUB_WORKSPACE/verify-config.py" <<'PYCODE'
        import os,pathlib,re,json,shutil,subprocess,sys
        p=pathlib.Path(os.environ['GITHUB_WORKSPACE']); out=p/'dist/metadata'; e=os.environ
        s=pathlib.Path('.config').read_text(); c=dict(re.findall(r'^(CONFIG_\w+)=(.*)$',s,re.M))
        shutil.copyfile('.config',out/'final.config')
        (out/'kernel-source-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
        release=subprocess.check_output(['make','-s','kernelrelease','LOCALVERSION=-'+sys.argv[1]]+(['LLVM=1','LLVM_IAS=1'] if e['BUILD_COMPILER']=='llvm' else []),text=True).strip()
        (out/'kernel-release.txt').write_text(release+'\n')
        assert len(release)<=64, 'Kernel release exceeds 64 characters'
        checks={'CONFIG_X86_64':'y','CONFIG_SMP':'y','CONFIG_MODULES':'y','CONFIG_BLK_DEV_INITRD':'y','CONFIG_DEVTMPFS':'y','CONFIG_NO_HZ_IDLE':'y','CONFIG_NR_CPUS':e['BUILD_NR'],'CONFIG_HZ':e['BUILD_HZ'],'CONFIG_CPU_FREQ_DEFAULT_GOV_'+e['BUILD_GOVERNOR'].upper():'y'}
        checks['CONFIG_PREEMPT_RT' if e['BUILD_PREEMPTION']=='rt' else 'CONFIG_PREEMPT']='y'
        opt={'1':'CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE','2':'CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3','3':'CONFIG_CC_OPTIMIZE_FOR_SIZE'}[e['BUILD_OPT']]; checks[opt]='y'
        errors=[]
        sched=e['BUILD_SCHEDULER']
        if sched=='bore': checks['CONFIG_SCHED_BORE']='y'
        elif c.get('CONFIG_SCHED_BORE','n')!='n': errors.append('Unexpected BORE')
        if sched in ('pds','bmq'):
            # Project C: SCHED_ALT on, exactly the requested variant selected.
            checks['CONFIG_SCHED_ALT']='y'
            checks['CONFIG_SCHED_'+sched.upper()]='y'
            other='CONFIG_SCHED_'+('BMQ' if sched=='pds' else 'PDS')
            if c.get(other,'n')!='n': errors.append(f'Unexpected {other}')
        elif c.get('CONFIG_SCHED_ALT','n')!='n': errors.append('Unexpected Project C (SCHED_ALT)')
        if sched=='muqss':
            checks['CONFIG_SCHED_MUQSS']='y'
            checks['CONFIG_RQ_'+e['BUILD_RUNQUEUE'].upper().replace('-','_')]='y'
        elif c.get('CONFIG_SCHED_MUQSS','n')!='n': errors.append('Unexpected MuQSS')
        # MuQSS and Project C replace the scheduler core sched_ext plugs into; if the Kconfig gate was lost, catch it here.
        gate={'muqss':'SCHED_MUQSS','pds':'SCHED_ALT','bmq':'SCHED_ALT'}.get(sched)
        if gate and c.get('CONFIG_SCHED_CLASS_EXT','n')!='n': errors.append(f'sched_ext enabled with {sched}; Kconfig gate missing')
        # The rewritten hunk is anchored on very little context, so confirm the gate landed inside the
        # SCHED_CLASS_EXT entry itself rather than anywhere else in the file.
        if gate:
            blk=re.search(r'^config SCHED_CLASS_EXT\n(.*?)(?=^\S|\Z)',pathlib.Path('kernel/Kconfig.preempt').read_text(),re.M|re.S)
            if blk and not re.search(r'^\s+depends on[^\n]*!'+gate,blk.group(1),re.M): errors.append(f'{sched} gate (depends on !{gate}) missing from SCHED_CLASS_EXT in kernel/Kconfig.preempt')
        # patch keeps going after a failed hunk; a .rej file means part of a patch is silently missing.
        rej=sorted(str(r) for r in pathlib.Path('.').rglob('*.rej') if '.git' not in r.parts)
        if rej: errors.append('Rejected patch hunks: '+', '.join(rej))
        if sched in ('pds','bmq','muqss') and c.get('CONFIG_PSI','n')!='n': errors.append('PSI must stay disabled with PDS/BMQ/MuQSS')
        if e['BUILD_SCHED_EXT']=='require': checks.update(CONFIG_DEBUG_INFO_BTF='y',CONFIG_SCHED_CLASS_EXT='y')
        elif c.get('CONFIG_DEBUG_INFO','n')!='n': errors.append('Debug info still enabled; the build would be slower and produce a -dbg package')
        if e['BUILD_MACHINE']=='e6410': checks.update(CONFIG_SWAP='y',CONFIG_ZSWAP='y',CONFIG_ZSMALLOC='y')
        errors+=[f'{k}: expected {v}, got {c.get(k,"unset")}' for k,v in checks.items() if c.get(k)!=v]
        if c.get('CONFIG_CMDLINE','""')!='""': errors.append('Unexpected built-in command line')
        if e['BUILD_PREEMPTION']=='full' and c.get('CONFIG_PREEMPT_RT','n')!='n': errors.append('Unexpected RT')
        mk=pathlib.Path('Makefile').read_text()
        if not re.search(r'^KBUILD_CFLAGS \+= -march='+re.escape(e['BUILD_ARCH'])+r'$',mk,re.M): errors.append('Requested -march missing')
        scx_state='sched_ext: '+('available' if c.get('CONFIG_SCHED_CLASS_EXT')=='y' else 'not available')
        (out/'validation.txt').write_text(('\n'.join(errors) if errors else 'Requested configuration checks passed. Hardware testing still required.')+'\n'+scx_state+'\n')
        assert not errors, '\n'.join(errors)
        print('Pre-build checks passed:',release,'|',scx_state)
        PYCODE
        python3 - <<'PYCODE'
        from pathlib import Path
        p=Path('linux-tkg/install.sh'); s=p.read_text()
        needle='    time make ${llvm_opt} -j ${_thread_num} bindeb-pkg LOCALVERSION=-${_kernel_flavor}'
        assert s.count(needle)==1, 'Upstream build hook changed; review before updating pin'
        s=s.replace(needle,'    python3 "$GITHUB_WORKSPACE/sched-compat.py" "$GITHUB_WORKSPACE/dist/metadata/sched-compat.txt" || exit 1\n    python3 "$GITHUB_WORKSPACE/verify-config.py" "$_kernel_flavor" || exit 1\n'+needle)
        p.write_text(s)
        PYCODE
        git -C linux-tkg diff -- install.sh > dist/metadata/ci-hook.patch
        cp verify-config.py sched-compat.py dist/metadata/
    - name: Build kernel packages
      working-directory: linux-tkg
      timeout-minutes: 320
      run: |
        ./install.sh install < /dev/null 2>&1 | tee "$GITHUB_WORKSPACE/dist/metadata/build.log"
    - name: Collect and verify matching image and headers
      run: |
        python3 - <<'PYCODE'
        import pathlib,subprocess,shutil,hashlib
        p=pathlib.Path('dist'); release=(p/'metadata/kernel-release.txt').read_text().strip()
        files=list(pathlib.Path('linux-tkg/DEBS').glob('*.deb')); assert files, 'No packages produced'
        found=set(); rows=[]
        for f in files:
            name=subprocess.check_output(['dpkg-deb','-f',str(f),'Package'],text=True).strip()
            arch=subprocess.check_output(['dpkg-deb','-f',str(f),'Architecture'],text=True).strip()
            assert arch in ['amd64','all'], 'Unexpected package architecture'
            rows.append(f'{f.name}\t{name}\t{arch}')
            found.add(name)
            # Debug-symbol packages (from sched_ext=require builds) are huge; list them but do not upload.
            if not name.endswith('-dbg'): shutil.copyfile(f,p/f.name)
        assert 'linux-image-'+release in found, 'Matching image missing'
        assert 'linux-headers-'+release in found, 'Matching headers missing'
        (p/'metadata/packages.tsv').write_text('\n'.join(rows)+'\n')
        (p/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(p.glob('*.deb'))))
        PYCODE
        { echo '### Packages verified'; cat dist/metadata/packages.tsv; } >> "$GITHUB_STEP_SUMMARY"
    - name: Preserve diagnostics
      if: always()
      run: |
        mkdir -p dist/metadata
        ccache --show-stats > dist/metadata/ccache.txt 2>&1 || true
        if [ -d linux-tkg/logs ]; then cp -r linux-tkg/logs dist/metadata/tkg-logs; fi
        if [ -f linux-tkg/kernelconfig.new ]; then cp linux-tkg/kernelconfig.new dist/metadata/tkg-final.config; fi
    - name: Upload validated packages
      uses: actions/upload-artifact@v6
      with:
        name: linux-tkg-${{ env.BUILD_SUFFIX }}
        path: |-
          dist/*.deb
          dist/SHA256SUMS
        if-no-files-found: error
        retention-days: 30
    - name: Upload build records even on failure
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: linux-tkg-records-${{ inputs.machine }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/metadata/
        if-no-files-found: warn
        retention-days: 30
