# Upload to .github/workflows/build-cachyos-e6410.yml.
# Requires configs/e6410.config from this device's working kernel.
# Version selection is resolved afresh on every dispatch/re-run of THIS revision.
# Default 6.18-latest stays in the 6.18 series; use 7.2-latest explicitly to change series.
# Exact upstream version selects its highest CachyOS revision; exact tag selects that tag.
# Numeric ordering, stable tags only, annotated tags peeled to source commit IDs.
# Tag and SHA are frozen per run and recorded in the summary and build records.
# No scheduled builds: start the workflow manually. No fallback to an older release.
# New source series can change Kconfig/build requirements; validation fails on mismatch.
# GCC O2, no debug information, no LTO/AutoFDO, no module trimming or sched_ext.
# Keep a known-working kernel; Secure Boot signing/enrollment is a separate task.
# E6410 fix retained: allow compiled intel_pstate; require ACPI cpufreq.
name: Build CachyOS - E6410 Devuan
'on':
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 6.18-latest (default), 7.2-latest, 6.18.51, or cachyos-6.18.51-2. Other series need validation.
        required: true
        type: string
        default: 6.18-latest
      cpu_target:
        description: 'E6410 Arrandale/Westmere: x86-64-v2. Generic x86-64 is available as a fallback.'
        type: choice
        required: true
        default: x86-64-v2
        options:
        - x86-64-v2
        - x86-64
      timer_hz:
        description: Timer frequency; start with 300 Hz
        type: choice
        required: true
        default: '300'
        options:
        - '300'
        - '500'
        - '1000'
      build_jobs:
        description: auto limits jobs by runner CPU/RAM; lower this after an out-of-memory failure
        type: choice
        required: true
        default: auto
        options:
        - auto
        - '2'
        - '4'
permissions:
  contents: read
concurrency:
  group: cachyos-e6410-${{ github.run_id }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash -euo pipefail {0}
env:
  CACHY_REPO: https://github.com/CachyOS/linux.git
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  ARCH: x86
  KBUILD_DEBARCH: amd64
  KBUILD_BUILD_USER: e6410-builder
  KBUILD_BUILD_HOST: github-actions
  KBUILD_BUILD_VERSION: '1'
  DEBFULLNAME: E6410 Kernel Builder
  DEBEMAIL: kernel-builder@localhost
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
    - name: Checkout your private repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Resolve requested CachyOS release
      env:
        VERSION_INPUT: ${{ inputs.kernel_version }}
      run: |
        python3 - <<'PYCODE'
        import os,re,json,pathlib,subprocess

        def select_release(request,listing):
            # Accept series-latest, an upstream patch version, or an exact CachyOS tag.
            request=request.strip()
            series=re.fullmatch(r'(\d+)\.(\d+)-latest',request)
            version=re.fullmatch(r'v?(\d+)\.(\d+)\.(\d+)',request)
            exact=re.fullmatch(r'(?:cachyos-)?(\d+)\.(\d+)\.(\d+)-(\d+)',request)
            if not (series or version or exact):
                raise ValueError('Use 6.18-latest, 7.2-latest, 6.18.51, or cachyos-6.18.51-2')
            groups=tuple(map(int,(series or version or exact).groups()))
            if groups[:2] < (6,18):
                raise ValueError('This workflow targets Linux 6.18 or newer; older trees require separate review')
            refs={}
            for line in listing.splitlines():
                parts=line.split()
                if len(parts)==2 and re.fullmatch(r'[0-9a-f]{40}',parts[0]): refs[parts[1]]=parts[0]
            matches=[]
            for ref,sha in refs.items():
                m=re.fullmatch(r'refs/tags/cachyos-(\d+)\.(\d+)\.(\d+)-(\d+)',ref)
                if not m: continue # Ignore RC, development, and peeled pseudo-tags.
                numbers=tuple(map(int,m.groups()))
                if series and numbers[:2]!=groups: continue
                if version and numbers[:3]!=groups: continue
                if exact and numbers!=groups: continue
                matches.append((numbers,ref,refs.get(ref+'^{}',sha)))
            if not matches: raise ValueError('No matching published CachyOS stable tag for '+request)
            numbers,ref,commit=max(matches,key=lambda item:item[0])
            return {'requested':request,'tag':ref.removeprefix('refs/tags/'),'commit':commit,
                    'kernel_version':'.'.join(map(str,numbers[:3])),'package_revision':str(numbers[3])}

        e=os.environ
        request=e['VERSION_INPUT']
        # Validate BEFORE contacting the remote; never put raw user text into a command.
        # The second call below performs selection using actual advertised tags.
        try:
            select_release(request,'')
        except ValueError as ex:
            if not str(ex).startswith('No matching published'): raise SystemExit(str(ex))
        r=subprocess.run(['git','ls-remote','--tags',e['CACHY_REPO'],'refs/tags/cachyos-*'],
                         check=True,text=True,capture_output=True,timeout=120)
        try: result=select_release(request,r.stdout)
        except ValueError as ex: raise SystemExit(str(ex))
        out=pathlib.Path('dist/metadata');out.mkdir(parents=True,exist_ok=True)
        (out/'resolved-source.json').write_text(json.dumps(result,indent=2)+'\n')
        with open(e['GITHUB_ENV'],'a') as f:
            for k,v in {'CACHY_TAG':result['tag'],'CACHY_COMMIT':result['commit'],
                        'EXPECTED_KERNEL_VERSION':result['kernel_version'],
                        'CACHY_PACKAGE_REVISION':result['package_revision']}.items(): f.write(k+'='+v+'\n')
        with open(e['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('### Selected CachyOS source\n\nRequest: `'+result['requested']+'`\n\nTag: `'+result['tag']+'`\n\nCommit: `'+result['commit']+'`\n')
        print(json.dumps(result,indent=2))
        PYCODE
    - name: Validate setup and inputs
      env:
        CPU_TARGET: ${{ inputs.cpu_target }}
        TIMER_HZ: ${{ inputs.timer_hz }}
        JOBS_INPUT: ${{ inputs.build_jobs }}
      run: |
        mkdir -p dist/metadata
        python3 - <<'PY'
        import os, pathlib, re, json
        e=os.environ
        p=pathlib.Path('configs/e6410.config')
        if not p.is_file():
            raise SystemExit('Missing configs/e6410.config. Export /boot/config-$(uname -r) ON THE E6410 and commit it at this path.')
        s=p.read_text()
        for item in ('CONFIG_X86_64=y','CONFIG_MODULES=y','CONFIG_BLK_DEV_INITRD=y'):
            if item not in s.splitlines(): raise SystemExit('Baseline is missing '+item)
        if e['CPU_TARGET'] not in ('x86-64-v2','x86-64'): raise SystemExit('Invalid CPU target')
        if e['TIMER_HZ'] not in ('300','500','1000'): raise SystemExit('Invalid timer frequency')
        if e['JOBS_INPUT'] not in ('auto','2','4'): raise SystemExit('Invalid job count')
        if not re.fullmatch('[0-9a-f]{40}',e['CACHY_COMMIT']): raise SystemExit('Expected a full source commit SHA')
        if not re.fullmatch(r'cachyos-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+',e['CACHY_TAG']): raise SystemExit('Invalid resolved CachyOS stable tag')
        suffix='-cachyos-e6410-r'+e['GITHUB_RUN_ID']+'a'+e['GITHUB_RUN_ATTEMPT']
        values={'LOCALVERSION':suffix, 'TARGET_ISA_LEVEL':'2' if e['CPU_TARGET']=='x86-64-v2' else '1', 'TARGET_TIMER_HZ':e['TIMER_HZ']}
        with open(e['GITHUB_ENV'],'a') as f:
            for k,v in values.items(): f.write(k+'='+v+'\n')
        pathlib.Path('dist/metadata/inputs.json').write_text(json.dumps({**values,'source_tag':e['CACHY_TAG'],'source_commit':e['CACHY_COMMIT'],'jobs':e['JOBS_INPUT']},indent=2)+'\n')
        PY
        cp configs/e6410.config dist/metadata/base.config
    - name: Make room on the hosted runner
      run: |
        # Only disposable, GitHub-hosted runner SDKs; never run on the E6410.
        sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android /opt/ghc
        df -h .
        available_kb=$(df -Pk . | awk 'NR==2 {print $4}')
        if (( available_kb < 35 * 1024 * 1024 )); then
          echo '::error::Need at least 35 GiB free before fetching kernel sources.'
          exit 1
        fi
    - name: Install Debian package build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential gcc-x86-64-linux-gnu bc bison flex \
          libssl-dev libelf-dev libdw-dev libncurses-dev \
          dwarves zstd xz-utils lz4 cpio rsync kmod \
          git ca-certificates python3 debhelper dpkg-dev fakeroot ccache
        echo /usr/lib/ccache >> "$GITHUB_PATH"
        {
          gcc --version
          ld --version
          ccache --version
          dpkg-query -W gcc binutils libc6-dev dpkg-dev debhelper dwarves
          printf 'Runner: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
        } > dist/metadata/toolchain.txt
    - name: Fetch resolved CachyOS source
      run: |
        git init -q kernel
        git -C kernel remote add origin "$CACHY_REPO"
        git -C kernel fetch --depth 1 origin "refs/tags/$CACHY_TAG"
        git -C kernel checkout --detach FETCH_HEAD
        actual=$(git -C kernel rev-parse HEAD)
        if [[ "$actual" != "$CACHY_COMMIT" ]]; then
          echo '::error::Source tag changed after resolution. Start a new run to resolve it again.'
          exit 1
        fi
        git -C kernel log -1 --format=fuller > dist/metadata/source.txt
        timestamp=$(git -C kernel show -s --format=%cD HEAD)
        echo "KBUILD_BUILD_TIMESTAMP=$timestamp" >> "$GITHUB_ENV"
        version=$(make -s -C kernel kernelversion)
        [[ "$version" == "$EXPECTED_KERNEL_VERSION" ]] || { echo '::error::Kernel version does not match the resolved tag'; exit 1; }
        echo "$version" > dist/metadata/kernel-version.txt
        echo "KERNEL_VERSION=$version" >> "$GITHUB_ENV"
    - name: Configure E6410 kernel
      working-directory: kernel
      run: |
        cp ../configs/e6410.config .config
        # Resolve renamed/removed options from the baseline before tuning.
        make CC=gcc HOSTCC=gcc olddefconfig < /dev/null 2>&1 | tee ../dist/metadata/configure-initial.log
        python3 - <<'PY'
        import os, subprocess, pathlib, json
        e=os.environ
        # Keep broad device coverage from the baseline. No localmodconfig.
        wanted={
          '64BIT':'y','X86_64':'y','SMP':'y','NR_CPUS':'4',
          'GENERIC_CPU':'y','X86_NATIVE_CPU':'n','MZEN4':'n',
          'X86_64_VERSION':e['TARGET_ISA_LEVEL'],
          'CACHY':'y','SCHED_BORE':'n','SCHED_ALT':'n','SCHED_BMQ':'n',
          'CC_OPTIMIZE_FOR_PERFORMANCE':'y','CC_OPTIMIZE_FOR_PERFORMANCE_O3':'n','CC_OPTIMIZE_FOR_SIZE':'n',
          'LTO_NONE':'y','LTO_CLANG_FULL':'n','LTO_CLANG_THIN':'n',
          'AUTOFDO_CLANG':'n','PROPELLER_CLANG':'n','RUST':'n',
          'PREEMPT':'y','PREEMPT_DYNAMIC':'y','PREEMPT_RT':'n',
          'PREEMPT_NONE':'n','PREEMPT_VOLUNTARY':'n','PREEMPT_LAZY':'n',
          'NO_HZ_IDLE':'y','NO_HZ_FULL':'n','HZ_PERIODIC':'n',
          'CPU_FREQ':'y','CPU_FREQ_DEFAULT_GOV_SCHEDUTIL':'y',
          'CPU_FREQ_DEFAULT_GOV_PERFORMANCE':'n','CPU_FREQ_DEFAULT_GOV_ONDEMAND':'n',
          'CPU_FREQ_DEFAULT_GOV_USERSPACE':'n','CPU_FREQ_DEFAULT_GOV_POWERSAVE':'n','CPU_FREQ_DEFAULT_GOV_CONSERVATIVE':'n',
          'X86_INTEL_PSTATE':'y','ACPI_PROCESSOR':'y','X86_ACPI_CPUFREQ':'y','CPU_FREQ_GOV_SCHEDUTIL':'y',
          'MODULES':'y','BLK_DEV_INITRD':'y','DEVTMPFS':'y','DEVTMPFS_MOUNT':'y',
          'EFI':'y','EFI_STUB':'y','EFI_PARTITION':'y',
          'PCI':'y','ACPI':'y','DRM':'y','DRM_I915':'m',
          'SATA_AHCI':'m','BLK_DEV_NVME':'m','EXT4_FS':'m',
          'LOCALVERSION_AUTO':'n','CMDLINE_BOOL':'n','CMDLINE_OVERRIDE':'n',
          'DEBUG_INFO_NONE':'y','DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT':'n',
          'DEBUG_INFO_DWARF4':'n','DEBUG_INFO_DWARF5':'n',
          'DEBUG_INFO_BTF':'n','DEBUG_INFO_BTF_MODULES':'n','SCHED_CLASS_EXT':'n',
          'MODULE_SIG':'y','MODULE_SIG_ALL':'n','MODULE_SIG_FORCE':'n',
          'PSI':'y','PSI_DEFAULT_DISABLED':'n',
          'SWAP':'y','ZSWAP':'y','ZSMALLOC':'y','CRYPTO_ZSTD':'y','CRYPTO_LZ4':'y'
        }
        # Select HZ through its source-defined choice; do not write derived HZ.
        import re
        for symbol in re.findall(r'^\s*config (HZ_\d+)\s*$',pathlib.Path('kernel/Kconfig.hz').read_text(),re.M):
            wanted[symbol]='y' if symbol=='HZ_'+e['TARGET_TIMER_HZ'] else 'n'
        strings={'LOCALVERSION':'','CMDLINE':'','SYSTEM_TRUSTED_KEYS':'','SYSTEM_REVOCATION_KEYS':'','MODULE_SIG_KEY':'certs/signing_key.pem'}
        for k,v in wanted.items():
            args=['--enable',k] if v=='y' else ['--disable',k] if v=='n' else ['--module',k] if v=='m' else ['--set-val',k,v]
            subprocess.run(['scripts/config',*args],check=True)
        for k,v in strings.items(): subprocess.run(['scripts/config','--set-str',k,v],check=True)
        pathlib.Path('../dist/metadata/requested-config.json').write_text(json.dumps({'options':wanted,'strings':strings},indent=2)+'\n')
        PY
        make CC=gcc HOSTCC=gcc olddefconfig < /dev/null 2>&1 | tee ../dist/metadata/configure-final.log
        cp .config ../dist/metadata/final.config
        scripts/diffconfig ../configs/e6410.config .config > ../dist/metadata/config-diff.txt
    - name: Validate final configuration
      working-directory: kernel
      run: |
        python3 - <<'PY'
        import pathlib,re,os,json
        e=os.environ
        cfg=dict(re.findall(r'^(CONFIG_\w+)=(.*)$',pathlib.Path('.config').read_text(),re.M))
        required={'X86_64':'y','SMP':'y','NR_CPUS':'4','GENERIC_CPU':'y',
                  'X86_64_VERSION':e['TARGET_ISA_LEVEL'],'CACHY':'y',
                  'CC_OPTIMIZE_FOR_PERFORMANCE':'y','PREEMPT':'y','PREEMPT_DYNAMIC':'y',
                  'NO_HZ_IDLE':'y','HZ':e['TARGET_TIMER_HZ'],
                  'ACPI_PROCESSOR':'y','X86_ACPI_CPUFREQ':'y','CPU_FREQ_DEFAULT_GOV_SCHEDUTIL':'y',
                  'MODULES':'y','BLK_DEV_INITRD':'y','DEVTMPFS':'y',
                  'EFI':'y','EFI_STUB':'y','DRM_I915':'m',
                  'SATA_AHCI':'m','BLK_DEV_NVME':'m','EXT4_FS':'m','DEBUG_INFO_NONE':'y',
                  'SWAP':'y','ZSWAP':'y','ZSMALLOC':'y','CRYPTO_ZSTD':'y','CRYPTO_LZ4':'y'}
        disabled=['X86_NATIVE_CPU','MZEN4','SCHED_BORE','SCHED_ALT','SCHED_BMQ','SCHED_CLASS_EXT',
                  'PREEMPT_RT','PREEMPT_LAZY','NO_HZ_FULL','RUST','DEBUG_INFO_BTF',
                  'LTO_CLANG_FULL','LTO_CLANG_THIN','AUTOFDO_CLANG','PROPELLER_CLANG',
                  'CC_OPTIMIZE_FOR_SIZE','CC_OPTIMIZE_FOR_PERFORMANCE_O3','MODULE_SIG_FORCE','LOCALVERSION_AUTO']
        errors=[]
        for k,v in required.items():
            if cfg.get('CONFIG_'+k)!=v: errors.append(f'{k}: expected {v}, found {cfg.get("CONFIG_"+k,"unset")}')
        for k in disabled:
            if cfg.get('CONFIG_'+k,'n')!='n': errors.append(k+' unexpectedly enabled')
        for k in ['LOCALVERSION','CMDLINE','SYSTEM_TRUSTED_KEYS','SYSTEM_REVOCATION_KEYS']:
            if cfg.get('CONFIG_'+k,'""')!='""': errors.append(k+' is not empty')
        out=pathlib.Path('../dist/metadata/validation.txt')
        out.write_text('\n'.join(errors)+'\n' if errors else 'Requested E6410 settings passed; physical-device testing remains required.\n')
        if errors: raise SystemExit('\n'.join(errors))
        print(out.read_text())
        PY
        release=$(make -s CC=gcc HOSTCC=gcc kernelrelease)
        [[ "$release" == "${EXPECTED_KERNEL_VERSION}${LOCALVERSION}" ]] || { echo '::error::Unexpected kernel release'; exit 1; }
        (( ${#release} <= 64 )) || { echo '::error::Kernel release exceeds 64 characters'; exit 1; }
        printf '%s\n' "$release" > ../dist/metadata/kernel-release.txt
        echo "KERNEL_RELEASE=$release" >> "$GITHUB_ENV"
        # Validate ISA selection translates to the expected compiler target.
        make -s CC=gcc HOSTCC=gcc --eval='print-ci-flags:;@echo $(KBUILD_CFLAGS)' print-ci-flags > ../dist/metadata/compiler-flags.txt
        python3 - <<'PY'
        import pathlib,os,shlex
        flags=shlex.split(pathlib.Path('../dist/metadata/compiler-flags.txt').read_text())
        targets=[f for f in flags if f.startswith('-march=')]
        expected='-march=x86-64-v2' if os.environ['TARGET_ISA_LEVEL']=='2' else '-march=x86-64'
        if not targets or targets[-1]!=expected: raise SystemExit('Unexpected compiler target: '+str(targets))
        PY
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: cachyos-e6410-${{ runner.os }}-${{ env.CACHY_COMMIT }}-${{ inputs.cpu_target }}-${{ hashFiles('dist/metadata/toolchain.txt',
          'dist/metadata/final.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cachyos-e6410-${{ runner.os }}-${{ env.CACHY_COMMIT }}-${{ inputs.cpu_target }}-
    - name: Set cache and build parallelism
      env:
        JOBS_INPUT: ${{ inputs.build_jobs }}
      run: |
        ccache --max-size=2G
        ccache --zero-stats
        python3 - <<'PY'
        import os,pathlib
        e=os.environ
        available=int(next(l.split()[1] for l in pathlib.Path('/proc/meminfo').read_text().splitlines() if l.startswith('MemAvailable:')))
        cpus=len(os.sched_getaffinity(0))
        # Reserve ~2 GiB for other processes; allow ~1.5 GiB per compiler job.
        memory_jobs=max(1,(available-2*1024*1024)//(1536*1024))
        jobs=max(1,min(cpus,memory_jobs))
        if e['JOBS_INPUT']!='auto': jobs=min(jobs,int(e['JOBS_INPUT']))
        with open(e['GITHUB_ENV'],'a') as f: f.write('BUILD_JOBS='+str(jobs)+'\n')
        pathlib.Path('dist/metadata/build-jobs.txt').write_text(str(jobs)+'\n')
        print('Compiler jobs:',jobs)
        PY
    - name: Build kernel image and Debian packages
      working-directory: kernel
      timeout-minutes: 300
      run: |
        # GCC is reached through the ccache wrapper path. No SIMD/KCFLAGS hacks.
        # bindeb-pkg creates image, matching headers, and ancillary packages.
        make -j"$BUILD_JOBS" CC=gcc HOSTCC=gcc \
          KDEB_PKGVERSION="${KERNEL_VERSION}-${CACHY_PACKAGE_REVISION}+r${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
          bindeb-pkg < /dev/null 2>&1 | tee ../dist/metadata/build.log
    - name: Verify and collect installable packages
      run: |
        python3 - <<'PY'
        import os,pathlib,subprocess,shutil,hashlib,json
        p=pathlib.Path('dist'); release=os.environ['KERNEL_RELEASE']
        expected={'linux-image-'+release,'linux-headers-'+release}
        found=set(); rows=[]
        for f in sorted(pathlib.Path('.').glob('*.deb')):
            name=subprocess.check_output(['dpkg-deb','-f',str(f),'Package'],text=True).strip()
            arch=subprocess.check_output(['dpkg-deb','-f',str(f),'Architecture'],text=True).strip()
            version=subprocess.check_output(['dpkg-deb','-f',str(f),'Version'],text=True).strip()
            rows.append({'file':f.name,'package':name,'architecture':arch,'version':version})
            if name in expected:
                if arch!='amd64': raise SystemExit('Unexpected architecture: '+arch)
                if name in found: raise SystemExit('Duplicate package: '+name)
                subprocess.run(['dpkg-deb','--info',str(f)],check=True,stdout=subprocess.DEVNULL)
                shutil.copyfile(f,p/f.name); found.add(name)
        (p/'metadata/packages.json').write_text(json.dumps(rows,indent=2)+'\n')
        if found!=expected: raise SystemExit('Missing expected packages: '+str(expected-found))
        (p/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(p.glob('*.deb'))))
        note=f'''E6410 CachyOS source build: {release}
        Only the verified image and matching headers are included.
        On the E6410, extract into a separate folder and run:
          sha256sum -c SHA256SUMS
          sudo apt install ./*.deb
        Resolve any DKMS errors. Check that the matching initramfs exists,
        run sudo update-grub, and confirm both the new and previous kernels.
        Keep the known-working Devuan/TKG kernel installed.
        If Secure Boot is enabled, arrange kernel/module signing and enrollment
        before attempting to boot this build. No enrollment is done by CI.
        Retain required existing boot options. Do not add intel_pstate parameters.
        Optional zswap needs active disk-backed swap; inspect swapon --show.
        If appropriate, test zswap.enabled=1 zswap.compressor=zstd in GRUB.
        This build includes zswap support but does not configure swap devices.
        Diagnostics are in the separate build-records artifact.
        '''
        (p/'INSTALL.txt').write_text(note)
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('### E6410 packages verified\n\nKernel: `'+release+'`\n\nDownload packages and build records.\n')
        PY
    - name: Collect diagnostics on success or failure
      if: always()
      run: |
        mkdir -p dist/metadata
        ccache --show-stats > dist/metadata/ccache.txt 2>&1 || true
        df -h . > dist/metadata/disk.txt
        if [ -f kernel/.config ]; then cp kernel/.config dist/metadata/final.config; fi
    - name: Upload verified image and headers
      uses: actions/upload-artifact@v4
      with:
        name: cachyos-e6410-packages-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          dist/*.deb
          dist/SHA256SUMS
          dist/INSTALL.txt
        if-no-files-found: error
        retention-days: 30
    - name: Upload build records even on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cachyos-e6410-records-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/metadata/
        if-no-files-found: warn
        retention-days: 30
